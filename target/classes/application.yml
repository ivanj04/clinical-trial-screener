spring:
  application:
    name: clinical-trial-screener
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/ctscreener}
      auto-index-creation: true
  profiles:
    active: dev

app:
  jwt:
    secret: ${JWT_SECRET:supersecretkey32charsminimumhere!}
    expiration-ms: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.ivanjiang.ctscreener: DEBUG
